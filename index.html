<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>급여 대행 프로그램 · TEAM JINO</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1d2433;--sub:#5b6577;--line:#d5dbe5;--accent:#1f3864;--err:#b23a2b}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif}
.box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:28px 28px 22px;width:min(380px,90vw);box-shadow:0 8px 30px rgba(20,30,60,.08)}
h1{font-size:19px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--sub);font-size:13.5px;line-height:1.55}
input{font:inherit;font-size:15px;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:7px;margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;width:100%;padding:11px;border-radius:7px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--sub)}
.msg.err{color:var(--err);font-weight:600}
.foot{margin-top:14px;font-size:11.5px;color:var(--sub)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>급여 대행 프로그램</h1>
  <p>TEAM JINO 비밀번호를 넣어 주세요.<br>보험료정산 프로그램 등과 같은 비밀번호입니다.</p>
  <input type="password" id="pw" placeholder="비밀번호 (예: Ab12-Cd34-Ef56)" autocomplete="current-password" autofocus>
  <button id="go" type="submit">열기</button>
  <div class="msg" id="msg" role="status"></div>
  <div class="foot">노무그룹지노 · 열쇠 파일은 인터넷으로 확인합니다.</div>
</form>

var $=function(id){return document.getElementById(id)};
var unb64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
function say(t,err){var m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'')}
async function fetchKeys(){
  var r=await fetch(KEY_URL+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  var d=await r.json(); try{localStorage.setItem(CACHE,JSON.stringify(d))}catch(e){}
  return d;
}
async function unwrap(pw,e){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(e.salt),iterations:e.iter||150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},wk,unb64(e.wk)));
}
async function tryAll(pw,d){
  var list=(d&&d.entries)||[];
  for(var i=0;i<list.length;i++){try{return {id:list[i].id,k:await unwrap(pw,list[i])}}catch(e){}}
  return null;
}
async function openApp(k){
  var key=await crypto.subtle.importKey('raw',k,'AES-GCM',false,['decrypt']);
  var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(PAYLOAD_IV)},key,unb64(PAYLOAD));
  var html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
// 열어 둔 화면도 10분마다 열쇠 파일을 다시 확인 — 삭제된 구성원이면 잠금
function watch(id){
  setInterval(async function(){
    try{var d=await fetchKeys();var ok=(d.entries||[]).some(function(e){return e.id===id});
      if(!ok){alert('이 비밀번호는 더 이상 쓸 수 없습니다. 프로그램을 잠급니다.');location.reload()}}
    catch(e){/* 인터넷이 잠시 끊긴 경우는 그대로 둠 */}
  },RECHECK);
}
$('f').onsubmit=async function(ev){
  ev.preventDefault();var pw=$('pw').value.trim();if(!pw){say('비밀번호를 넣어 주세요.',true);return}
  $('go').disabled=true;say('확인하는 중…');
  try{
    var d=null,offline=false;
    try{d=await fetchKeys()}catch(e){offline=true;try{d=JSON.parse(localStorage.getItem(CACHE)||'null')}catch(x){}}
    if(!d){say('열쇠 파일을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.',true);return}
    var hit=await tryAll(pw,d);
    if(!hit){say('비밀번호가 맞지 않거나 사용이 중지된 비밀번호입니다.',true);return}
    if(offline&&hit.id!=='master'){say('인터넷에 연결되지 않아 열쇠 파일을 확인할 수 없습니다. 연결 후 다시 시도해 주세요.',true);return}
    say('여는 중…');window.__JINO_PW='jino-team:'+btoa(String.fromCharCode.apply(null,hit.k));window.__JINO_PW_OLD=pw;await openApp(hit.k);watch(hit.id);
  }catch(e){say('열지 못했습니다: '+(e&&e.message||e),true)}
  finally{var g=$('go');if(g){g.disabled=false}}
};
})();
